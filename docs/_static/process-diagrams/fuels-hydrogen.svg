<svg xmlns="http://www.w3.org/2000/svg" width="640" height="486" viewBox="0 0 640 486" role="img" aria-labelledby="title description" font-family="Arial, Helvetica, sans-serif" fill="#203645"><title id="title">Hydrogen production and delivery</title><desc id="description">No fuel blend data: skip the fuels transformation Estimate demand and delivery shares: Sector demand, plant or station scale, distribution rules; Prepare regional production and delivery activities: Mapped inventories, IAM efficiency or electrolysis fallback; Build general and eligible sector markets: Production mix plus pipeline or demand-weighted delivery services; Link consumers and check the supply chain: Available sector or general market; recheck after all updates</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#59768a"/></marker></defs><rect x="20" y="16" width="600" height="66" rx="9" fill="#fff9e9" stroke="#b9974f" stroke-width="1.5"/><text x="38" y="47" font-size="18" font-weight="600">Data availability</text><text x="38" y="68" font-size="15" fill="#425466">No fuel blend data: skip the fuels transformation</text><rect x="20" y="98" width="600" height="66" rx="9" fill="#f0f6fa" stroke="#96b2c4" stroke-width="1.5"/><circle cx="44" cy="124" r="12" fill="#245b78"/><text x="44" y="129" text-anchor="middle" font-size="13" fill="white">1</text><text x="66" y="129" font-size="18" font-weight="600">Estimate demand and delivery shares</text><text x="66" y="150" font-size="15" fill="#425466">Sector demand, plant or station scale, distribution rules</text><path d="M320 164 v24" stroke="#59768a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="200" width="600" height="66" rx="9" fill="#f0f6fa" stroke="#96b2c4" stroke-width="1.5"/><circle cx="44" cy="226" r="12" fill="#245b78"/><text x="44" y="231" text-anchor="middle" font-size="13" fill="white">2</text><text x="66" y="231" font-size="18" font-weight="600">Prepare regional production and delivery activities</text><text x="66" y="252" font-size="15" fill="#425466">Mapped inventories, IAM efficiency or electrolysis fallback</text><path d="M320 266 v24" stroke="#59768a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="302" width="600" height="66" rx="9" fill="#f0f6fa" stroke="#96b2c4" stroke-width="1.5"/><circle cx="44" cy="328" r="12" fill="#245b78"/><text x="44" y="333" text-anchor="middle" font-size="13" fill="white">3</text><text x="66" y="333" font-size="18" font-weight="600">Build general and eligible sector markets</text><text x="66" y="354" font-size="15" fill="#425466">Production mix plus pipeline or demand-weighted delivery services</text><path d="M320 368 v24" stroke="#59768a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="404" width="600" height="66" rx="9" fill="#f0f6fa" stroke="#96b2c4" stroke-width="1.5"/><circle cx="44" cy="430" r="12" fill="#245b78"/><text x="44" y="435" text-anchor="middle" font-size="13" fill="white">4</text><text x="66" y="435" font-size="18" font-weight="600">Link consumers and check the supply chain</text><text x="66" y="456" font-size="15" fill="#425466">Available sector or general market; recheck after all updates</text></svg>
