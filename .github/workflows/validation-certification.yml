name: Validation certification

on:
  schedule:
    - cron: "17 2 * * *"
    - cron: "43 3 * * 0"
  workflow_dispatch:
    inputs:
      tier:
        description: Certification tier to run
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - full-matrix

permissions:
  contents: read

concurrency:
  group: validation-certification-${{ github.ref }}-${{ github.event.schedule || inputs.tier }}
  cancel-in-progress: false

jobs:
  credentials:
    name: Check certification credentials
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - name: Check required repository secrets
        id: check
        shell: bash
        env:
          IAM_FILES_KEY: ${{ secrets.IAM_FILES_KEY }}
          EI_USERNAME: ${{ secrets.EI_USERNAME }}
          EI_PASSWORD: ${{ secrets.EI_PASSWORD }}
        run: |
          missing=()
          for credential in IAM_FILES_KEY EI_USERNAME EI_PASSWORD; do
            if [[ -z "${!credential}" ]]; then
              missing+=("$credential")
            fi
          done

          if (( ${#missing[@]} == 0 )); then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Certification credentials are available." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "available=false" >> "$GITHUB_OUTPUT"
          message="Missing repository secrets: ${missing[*]}. Configure them to run certification."
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "::error::$message"
            echo "Certification could not start. $message" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "::notice::Certification skipped. $message"
          echo "Certification skipped; no certification tests or profiling ran. $message" >> "$GITHUB_STEP_SUMMARY"

  nightly:
    needs: credentials
    if: >-
      needs.credentials.outputs.available == 'true' &&
      (github.event.schedule == '17 2 * * *' ||
      (github.event_name == 'workflow_dispatch' && inputs.tier == 'nightly'))
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install premise and integration dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-instafail
          python -m pip install -e .
          python -m pip check
      - name: Verify numerical runtime imports
        run: |
          python -c "import numpy as np; import pyarrow as pa; from premise import NewDatabase; assert pa.array(np.array([1.0])).to_pylist() == [1.0]; print(f'NumPy {np.__version__}, PyArrow {pa.__version__}')"
      - name: Certify ecoinvent 3.12, IAM interpolation, and every exporter
        id: certify
        env:
          IAM_FILES_KEY: ${{ secrets.IAM_FILES_KEY }}
          EI_USERNAME: ${{ secrets.EI_USERNAME }}
          EI_PASSWORD: ${{ secrets.EI_PASSWORD }}
          PYTHONHASHSEED: "0"
        run: >-
          pytest -q --instafail
          tests/test_process_ei312_cutoff.py
          tests/test_process_ei312_conseq.py
          tests/test_process_interpolated_year.py
      - name: Profile certification warnings
        id: profile
        if: steps.certify.outcome == 'success'
        env:
          IAM_FILES_KEY: ${{ secrets.IAM_FILES_KEY }}
          PYTHONHASHSEED: "0"
        run: >-
          python benchmarks/profile_new_database.py
          --project ecoinvent-3.12-cutoff
          --source-db ecoinvent-3.12-cutoff
          --source-version 3.12
          --biosphere ecoinvent-3.12-biosphere
          --system-model cutoff
          --model image
          --pathway SSP2-M
          --year 2050
          --inventory-backend compact
          --output validation-profile.json
      - name: Reject unreviewed validation warnings
        if: steps.profile.outcome == 'success'
        run: >-
          python benchmarks/check_validation_warnings.py
          --baseline tests/data/validation_warning_baselines.yaml
          --profile validation-profile.json
          --case ecoinvent-3.12-cutoff-image-SSP2-M-2050

  full-matrix:
    needs: credentials
    if: >-
      needs.credentials.outputs.available == 'true' &&
      (github.event.schedule == '43 3 * * 0' ||
      (github.event_name == 'workflow_dispatch' && inputs.tier == 'full-matrix'))
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        test-file:
          - tests/test_process_ei38_cutoff.py
          - tests/test_process_ei38_conseq.py
          - tests/test_process_ei39_cutoff.py
          - tests/test_process_ei39_conseq.py
          - tests/test_process_ei310_cutoff.py
          - tests/test_process_ei310_conseq.py
          - tests/test_process_ei311_cutoff.py
          - tests/test_process_ei311_conseq.py
          - tests/test_process_ei312_cutoff.py
          - tests/test_process_ei312_conseq.py
          - tests/test_process_ei312_EN15804.py
          - tests/test_process_interpolated_year.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install premise and integration dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-instafail
          python -m pip install -e .
          python -m pip check
      - name: Verify numerical runtime imports
        run: |
          python -c "import numpy as np; import pyarrow as pa; from premise import NewDatabase; assert pa.array(np.array([1.0])).to_pylist() == [1.0]; print(f'NumPy {np.__version__}, PyArrow {pa.__version__}')"
      - name: Certify supported source/system-model case
        env:
          IAM_FILES_KEY: ${{ secrets.IAM_FILES_KEY }}
          EI_USERNAME: ${{ secrets.EI_USERNAME }}
          EI_PASSWORD: ${{ secrets.EI_PASSWORD }}
          PYTHONHASHSEED: "0"
        run: pytest -q --instafail "${{ matrix.test-file }}"
